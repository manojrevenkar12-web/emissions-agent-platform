# Who may call which tool. Agents act as service principals with the narrowest role that does their job.
# The tenant is part of the principal (from the API key or the agent's job), never a tool argument.
roles:
  customer_viewer: [query_emissions]
  qa_agent: [query_emissions]
  mapping_agent: [get_file_profile, get_carrier_mapping]
  clarification_agent: [list_missing_fuel, send_carrier_email, set_primary_data]
  analyst: [query_emissions, approve, override_mapping, set_primary_data, list_approvals, get_file_profile]
  platform_admin: [read_audit, list_approvals]

# API keys are stored as SHA-256 hashes; the service reads the keys themselves from Key Vault or the
# environment. These demo keys exist only for local runs and tests: demo-viewer-t1, demo-viewer-t2,
# demo-analyst-anna, demo-analyst-ben, demo-admin.
